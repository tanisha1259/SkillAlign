authors = [
    { name = "tanisha1259", email = "tanishaprakash259@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
